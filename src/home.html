<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <title>mrkvqv · Home</title>
    <link rel="preload" href="assets/fonts/JetBrainsMono.woff" as="font" type="font/woff" crossorigin />
    <link rel="stylesheet" href="home.css" />
    <script type="module" src="js/home.js"></script>
  </head>
  <body>
    <main class="scene" data-i18n-label="pageLabel">
      <div class="scene-inner">
        <div class="identity">mrkvqv</div>
        <div class="hero">
          <time class="clock" data-clock>--:--</time>
          <time class="date" data-date></time>
        </div>

        <div class="layout">
          <nav class="bookmarks" data-bookmarks data-i18n-label="pinsLabel"></nav>

          <section class="calendar" data-i18n-label="calendarLabel">
            <header class="month-heading">
              <h3 class="month-label" data-month-label aria-live="polite" aria-atomic="true"></h3>
              <div class="month-controls">
                <button class="nav-button" type="button" data-step-month="-1" data-i18n-label="prevMonth" title=""></button>
                <button class="nav-button" type="button" data-step-month="1" data-i18n-label="nextMonth" title=""></button>
              </div>
            </header>
            <table class="month-grid">
              <thead>
                <!-- Дни недели подписывает calendar.js на выбранном языке. -->
                <tr data-weekdays></tr>
              </thead>
              <tbody data-days></tbody>
            </table>
            <div class="selection">
              <button class="nav-button" type="button" data-step-day="-1" data-i18n-label="prevDay" title=""></button>
              <time class="selected-date" data-selected-date aria-live="polite" aria-atomic="true"></time>
              <button class="nav-button" type="button" data-step-day="1" data-i18n-label="nextDay" title=""></button>
            </div>
            <div class="reset-row">
              <button class="reset" type="button" data-today data-i18n="today"></button>
            </div>
          </section>
        </div>

        <section class="agenda" data-agenda data-i18n-label="agendaLabel">
          <header class="agenda-header">
            <div class="agenda-title-row">
              <h2 class="agenda-heading" data-agenda-heading></h2>
              <span class="event-count" data-event-count></span>
            </div>
            <div class="sync-controls">
              <span class="sync-status" data-sync-status role="status"></span>
              <details class="calendar-list" data-calendar-list></details>
              <button class="refresh-events" type="button" data-refresh-events data-i18n="refresh"></button>
            </div>
          </header>
          <div class="event-list-frame" data-event-frame>
            <div class="event-list" data-event-list></div>
          </div>
        </section>
      </div>
    </main>

    <!-- Кнопка языка в правом нижнем углу окна (собирает language-menu.js). -->
    <details class="lang-menu" data-lang-menu></details>

    <template data-setup>
      <form class="setup" data-setup-form>
        <p class="setup-text"><span data-i18n="setupBefore"></span> <code>pnpm bridge-key</code> <span data-i18n="setupAfter"></span></p>
        <div class="setup-row">
          <input
            class="setup-input"
            name="token"
            type="password"
            autocomplete="off"
            spellcheck="false"
            data-i18n-placeholder="bridgeKey"
            data-i18n-label="bridgeKey"
            required
            minlength="32"
          />
          <button class="refresh-events" type="submit" data-i18n="save"></button>
        </div>
      </form>
    </template>
  </body>
</html>
